paths:
  /api/calendar:
    get:
      summary: "내 일정 목록 조회"
      tags:
        - Calendar
      description: "로그인한 사용자의 userID를 기준으로 DB에 저장된 모든 일정을 시작 날짜 순으로 가져옵니다."
      responses:
        200:
          description: "조회 성공"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  total:
                    type: integer
                  list:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScheduleResponse'
        401:
          description: "로그인이 필요합니다."

    post:
      summary: "새 일정 작성 및 외부 캘린더 연동"
      tags:
        - Calendar
      description: "사용자의 토큰 상태에 따라 Google Calendar 및 카카오 톡캘린더에 이벤트를 동시 등록하고 DB에 저장합니다."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scheduleName, startDate, endDate]
              properties:
                scheduleName:
                  type: string
                  description: "일정 제목"
                  example: "전세 계약 확정일자 신청"
                startDate:
                  type: string
                  format: date-time
                  description: "일정 시작 일시 (⚠️ 카카오 알림톡 정상 작동을 위해 무조건 미래 날짜로 테스트)"
                  example: "2026-06-15T09:00:00Z"
                endDate:
                  type: string
                  format: date-time
                  example: "2026-06-15T10:00:00Z"
                alarm:
                  type: integer
                  default: 1440
                  description: "일정 시작 몇 분 전 알림을 보낼지 설정 (카카오 톡캘린더 연동 규격 - 분 단위)"
                  example: 1440
                alarmEnabled:
                  type: boolean
                  default: true
                  description: "알림 활성화 여부"
                  example: true
      responses:
        201:
          description: "일정 생성 및 외부 캘린더 등록 성공"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/ScheduleResponse'
        401:
          description: "로그인이 필요합니다."
        400:
          description: "유효하지 않은 날짜 형식입니다."
        500:
          description: "서버 오류 및 일정 생성 실패"